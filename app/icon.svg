<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 68" width="128" height="136">
  <!-- 3D Bottom Lip (#B92B1C) -->
  <rect x="0" y="4" width="64" height="64" rx="16" fill="#B92B1C"/>
  <!-- Main Vermillion Face (#F04E37) -->
  <rect x="0" y="0" width="64" height="64" rx="16" fill="#F04E37" stroke="#B92B1C" stroke-width="2"/>
  <!-- Rising Sun above Mount Shalbuzdag -->
  <circle cx="32" cy="17" r="6" fill="#F8FAFC"/>
  <!-- Main Left Peak (Shalbuzdag) -->
  <polygon points="8,50 25,22 40,50" fill="#F8FAFC"/>
  <!-- Subtle Midnight Navy facet on Left Peak -->
  <polygon points="25,22 31,50 40,50" fill="#0B132B" opacity="0.22"/>
  <!-- Right Twin Peak -->
  <polygon points="28,50 43,26 56,50" fill="#F8FAFC"/>
  <!-- Crisp Midnight Navy ridge separator -->
  <polygon points="25,22 29,36 23,42 26,50 22,50 20,41 25,35" fill="#0B132B"/>
  <!-- Base ethnic bars -->
  <rect x="8" y="47" width="48" height="4" rx="2" fill="#0B132B"/>
  <rect x="12" y="51" width="40" height="3" rx="1.5" fill="#F8FAFC"/>
</svg>
